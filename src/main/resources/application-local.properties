spring.datasource.url=jdbc:h2:file:./.local-data/your-auth
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

api.security.access-token.secret=1234
api.security.access-token.issuer=your-auth-api
api.security.access-token.duration=PT6M

api.security.refresh-token.secret=123456
api.security.account-refresh-token.duration=P7D

api.security.project-api-key.secret=${PROJECT_API_KEY_SECRET:123456}
api.security.project-api-key.environment=${PROJECT_API_KEY_ENVIRONMENT:dev}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}

spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=3s

spring.cache.type=redis
spring.cache.cache-names=activePlans,projectById,projectsByAccountId,currentByAccountId,authConfigByProjectAndAccount,passwordConfigByProjectId,passwordConfigByProjectAndAccount,accountSummaryByAccountId,accountUsageByOwnerAccountId,projectMembersByProjectId,userById,usersByProjectId,projectApiKeyById,projectApiKeysByProjectId
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=minha-api::
